# 服务器：在仓库根目录与 .env 同放，docker-compose build && docker-compose up -d
# MySQL 不映射宿主机端口；账号 Excel 放宿主机 /opt/sandbox/data，容器内只读挂载为 /data
# 老版 docker-compose（如 1.22）不识别 3.8，使用 3.3 兼容
version: "3.3"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - db
    ports:
      - "80:8000"
    volumes:
      - /opt/sandbox/data:/data:ro

volumes:
  mysql_data:
